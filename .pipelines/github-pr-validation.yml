#################################################################################
#              ACL GitHub PR Validation - Trigger                                #
#                                                                               #
# Thin entry point for GitHub PR validation, living in the GitHub repo          #
# (microsoft/azure-container-linux). Triggers on PRs targeting aclmain and      #
# release branches, and extends the shared ACL-GitHub-PR.yml template in the    #
# acl-pipelines ADO repo, which runs the actual build and test.                 #
#                                                                               #
# Security:                                                                     #
#   - Fork PRs do NOT get secrets by default (ADO default behavior)             #
#   - Use "Require a team member's comment to run" in pipeline settings         #
#     to gate fork PR builds (standard ADO mechanism)                           #
#################################################################################

trigger: none

pr:
  branches:
    include:
      - aclmain
      - release/*

parameters:
  # A digest pin requires an acl_pipelines resource version that supports it,
  # such as gsettles/sdk-ab-validation; leave the normal resource default alone.
  - name: sdkImageRef
    displayName: '[Source] SDK digest override (none uses normal SDK)'
    type: string
    default: 'none'

resources:
  repositories:
    - repository: acl_pipelines
      type: git
      name: ACL/acl-pipelines
      ref: refs/heads/main
    - repository: azure_container_linux
      type: github
      endpoint: github.com_acl
      name: microsoft/azure-container-linux
      ref: $(Build.SourceBranch)
    - repository: mantle
      type: github
      endpoint: github.com_acl
      name: microsoft/azure-container-linux-mantle
      ref: refs/heads/aclmain

variables:
  - template: pipelines/templates/variables/acl-defaults.yml@acl_pipelines
  - template: pipelines/templates/variables/pipelines-root-onees.yml@acl_pipelines

extends:
  template: pipelines/ACL-GitHub-PR.yml@acl_pipelines
  parameters:
    aclRef: $(Build.SourceBranch)
    mantleRef: 'aclmain'
    testGeneratePackageManifest: true
    # Omit the new parameter for default runs against older shared templates.
    ${{ if and(ne(parameters.sdkImageRef, ''), ne(parameters.sdkImageRef, 'none')) }}:
      sdkImageRef: ${{ parameters.sdkImageRef }}
