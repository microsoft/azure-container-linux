[Unit]
# Order after the PTP device if present without waiting for it when unavailable.
# No Wants= on purpose: CVMs never get this device, so it would stall chronyd every
# boot. Cost is that a late device waits for the next chronyd restart.
After=dev-ptp_hyperv.device

[Service]
ExecStartPre=-/usr/libexec/chrony-azure-ptp
