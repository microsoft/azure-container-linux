# RPM mode: Copy essential /etc files from /usr/share/flatcar/etc at boot
# NOTE: /etc/pam.d and /etc/nsswitch.conf are handled by etc.conf from Flatcar overlay
# Security configs
C /etc/security - - - - /usr/share/flatcar/etc/security
# SSH configs
C /etc/ssh - - - - /usr/share/flatcar/etc/ssh
# SSL/TLS configs
C /etc/ssl - - - - /usr/share/flatcar/etc/ssl
# passwd/group/shadow from flatcar defaults
C /etc/passwd - - - - /usr/share/flatcar/etc/passwd
C /etc/group - - - - /usr/share/flatcar/etc/group
C /etc/shadow - - - - /usr/share/flatcar/etc/shadow
# Other essential configs
C /etc/login.defs - - - - /usr/share/flatcar/etc/login.defs
C /etc/profile - - - - /usr/share/flatcar/etc/profile
C /etc/profile.d - - - - /usr/share/flatcar/etc/profile.d
C /etc/shells - - - - /usr/share/flatcar/etc/shells
C /etc/skel - - - - /usr/share/flatcar/etc/skel
# Environment variables for PAM
C /etc/environment - - - - /usr/share/flatcar/etc/environment
# Default configs (useradd, etc)
C /etc/default - - - - /usr/share/flatcar/etc/default
