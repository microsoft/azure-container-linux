# The 90- prefix keeps this override after ACL's 10-acl.conf and
# AgentBaker's 50-default-config.conf. Load the modules here because the
# containerd sysext is merged after systemd-modules-load.service runs.
[Unit]
Wants=modprobe@erofs.service modprobe@dm_verity.service
After=modprobe@erofs.service modprobe@dm_verity.service

[Service]
Environment=CONTAINERD_CONFIG=/run/containerd/acl-config.toml
ExecStartPre=/usr/libexec/containerd2/acl-select-profile
