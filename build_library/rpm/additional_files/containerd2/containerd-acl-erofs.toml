# Imported when IPE is activated at boot
version = 4

[plugins."io.containerd.snapshotter.v1.erofs"]
  enable_dmverity_referrers = true
  # SELinux-enabled CRI supplies the workload label through the OCI spec.
  # The selector imports a separate fallback only when CRI SELinux is disabled.
  ovl_mount_options = []

[plugins."io.containerd.cri.v1.images"]
  snapshotter = "erofs"

[plugins."io.containerd.service.v1.diff-service"]
  default = ["erofs", "walking"]
