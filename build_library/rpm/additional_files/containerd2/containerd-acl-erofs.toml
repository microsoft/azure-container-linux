# ACL containerd configuration selected when the node security profile enables
# the EROFS runtime.
version = 2

imports = [
  "/etc/containerd/config.toml",
]

[plugins."io.containerd.snapshotter.v1.erofs"]
  dmverity_mode = "auto"
  enable_dmverity_referrers = true

[plugins."io.containerd.transfer.v1.local"]
  # Defining unpack_config REPLACES containerd's built-in default of
  # {platform, overlayfs, walking differ}, so preserve that path for every
  # supported ACL architecture alongside EROFS.
  [[plugins."io.containerd.transfer.v1.local".unpack_config]]
    platform = "linux/amd64"
    snapshotter = "overlayfs"
    differ = "walking"

  [[plugins."io.containerd.transfer.v1.local".unpack_config]]
    platform = "linux/amd64"
    snapshotter = "erofs"
    differ = "erofs"

  [[plugins."io.containerd.transfer.v1.local".unpack_config]]
    platform = "linux/arm64"
    snapshotter = "overlayfs"
    differ = "walking"

  [[plugins."io.containerd.transfer.v1.local".unpack_config]]
    platform = "linux/arm64"
    snapshotter = "erofs"
    differ = "erofs"

[plugins."io.containerd.differ.v1.erofs"]
  # Keep upstream local dm-verity formatting enabled for ordinary EROFS layers.
  # Signed OCI-referrer handling is a separate capability and is negotiated
  # only when the selected snapshotter advertises the same support.
  enable_dmverity = true
  enable_dmverity_referrers = true
  enable_tar_index = true
  mkfs_options = ["--sort=none", "-T", "0", "--mkfs-time"]

[plugins."io.containerd.grpc.v1.cri"]
  [plugins."io.containerd.grpc.v1.cri".containerd]
    snapshotter = "erofs"

[plugins."io.containerd.cri.v1.images"]
  snapshotter = "erofs"

[plugins."io.containerd.service.v1.diff-service"]
  default = ["erofs", "walking"]
