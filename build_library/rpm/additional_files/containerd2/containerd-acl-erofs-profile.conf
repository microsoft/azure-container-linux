# Installed by the IPE loader only after policy activation.
[Unit]
Wants=modprobe@erofs.service modprobe@dm_verity.service
After=modprobe@erofs.service modprobe@dm_verity.service

[Service]
ExecStartPre=/usr/libexec/containerd/acl-select-profile ${CONTAINERD_CONFIG}
ExecStart=
ExecStart=/usr/bin/containerd --config /run/containerd/acl-config.toml
