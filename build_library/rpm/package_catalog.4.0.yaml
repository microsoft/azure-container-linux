#
# Azure Linux 4.0 overlay for package_catalog.yaml.
#
# Entries here override the corresponding entries in package_catalog.yaml
# when AZL_RELEASEVER=4.0.  AzL4 follows Fedora/RHEL package naming, so many
# AzL3 package names were renamed or split.  Packages with no AzL4 equivalent
# are marked SKIP.
#
# Same format as package_catalog.yaml.

packages:
  # was: zstd-libs
  app-arch/zstd-libs: libzstd
  # was: cni
  app-containers/cni: containernetworking-plugins
  # was: containerd2
  app-containers/containerd: containerd
  # was: ca-certificates-shared
  app-crypt/ca-certificates-shared: ca-certificates
  # was: ca-certificates-tools
  app-crypt/ca-certificates-tools: ca-certificates
  # was: krb5
  app-crypt/mit-krb5: krb5-libs
  # was: vim
  app-editors/vim: vim-minimal
  # was: vim
  app-editors/vim-core: vim-minimal
  # was: walinuxagent-acl-config oras fuse fuse3-libs blobfuse2
  app-emulation/wa-linux-agent:
    - fuse
    - fuse3-libs
  # was: coreos-cloudinit
  coreos-base/coreos-cloudinit: SKIP
  # was: update-ssh-keys
  coreos-base/update-ssh-keys: SKIP
  # was: etcd
  dev-db/etcdctl: SKIP
  # was: expat-libs
  dev-libs/expat-libs: expat
  # was: libpcre2-16-0
  dev-libs/libpcre2-16: pcre2-utf16
  # was: libpcre2-32-0
  dev-libs/libpcre2-32: pcre2-utf32
  # was: libpcre2-8-0
  dev-libs/libpcre2-8: pcre2
  # was: libpcre2-posix2
  dev-libs/libpcre2-posix: pcre2
  # was: libusb
  dev-libs/libusb: libusb1
  # was: python3-urllib3 python-setuptools
  dev-python/urllib3:
    - python3-urllib3
    - python3-setuptools
  # was: iptables
  net-firewall/iptables: iptables-nft
  # was: rpcsvc-proto
  net-libs/rpcsvc-proto: rpcsvc-proto-devel
  # was: cni
  net-misc/cni: containernetworking-plugins
  # was: curl-libs
  net-misc/curl-libs: libcurl
  # was: ntp
  net-misc/ntp: chrony
  # was: wget
  net-misc/wget: wget2
  # was: gptfdisk
  sys-apps/gptfdisk: gdisk
  # was: grub2
  sys-boot/grub:
    - grub2-common
    - grub2-tools
  # was: grub2-efi
  sys-boot/grub-efi: grub2-efi-x64
  # was: grub2-efi-binary
  sys-boot/grub-efi-binary: grub2-efi-x64
  # was: shim
  sys-boot/shim: shim-x64
  # was: shim
  sys-boot/shim-signed: shim-x64
  # was: zlib
  sys-libs/zlib: zlib-ng-compat
  # was: zlib
  virtual/zlib: zlib-ng-compat

  # --- No runtime Azure Linux 4.0 build ---------------------------------
  # Present only in the 4.0 'sdk' (devel) repository, which is not a runtime
  # repository, so these cannot be installed into the image.
  # was: ncompress (sdk-only)
  app-arch/ncompress: SKIP
  # was: gflags (sdk-only)
  dev-cpp/gflags: SKIP
  # was: ebtables-legacy (sdk-only)
  net-firewall/ebtables: SKIP

  # ACL builds these in-tree against Azure Linux 3; they are not published
  # for 4.0 and are not yet rebuilt, so drop them from the 4.0 image.
  # was: coreos-init
  coreos-base/coreos-init: SKIP
  # was: bootengine
  sys-kernel/bootengine: SKIP
  # was: moby-engine sdnotify-proxy
  app-containers/docker: moby-engine
  # Azure Linux 4's ignition ships a dracut module that depends on url-lib,
  # which requires the curl binary.  curl is not otherwise pulled in now that
  # weak dependencies are disabled.
  app-admin/ignition: ignition curl
  sys-apps/ignition: ignition curl

  # Azure Linux 4 ships the container SELinux rules in a separate
  # container-selinux package and splits selinux-policy-targeted out of
  # selinux-policy; 3.0 bundles both into selinux-policy.
  sys-apps/systemd: systemd systemd-journal-remote libselinux-utils selinux-policy selinux-policy-targeted container-selinux policycoreutils ca-certificates irqbalance

  # Azure Linux 4 splits git into the perl porcelain (git) and the actual
  # binary (git-core).  git-core needs no perl, which the denylist strips
  # anyway, leaving broken scripts behind.
  # was: git
  dev-vcs/git: git-core

  # --- ACL in-tree packages on 4.0 -------------------------------------
  # acl/SPECS/ builds nine packages into the local RPM cache.  The 4.0 cache
  # (__build__/rpm-staging-4.0) is empty because none of them have been built
  # with AZL_TOOLKIT_BRANCH=4.0 yet.  Outcome on 4.0:
  #
  #   selinux-policy   -> SILENTLY REPLACED by stock selinux-policy 43.7 +
  #                       selinux-policy-targeted.  ACL's policy fork is a
  #                       different lineage (2.20240226-x) and its
  #                       customisations are absent; this is why the hotfix
  #                       and minimisation code needed 4.0 workarounds.
  #   coreos-init      -> SKIP (below); also has no 4.0 build in PMC.
  #   bootengine       -> SKIP (below); also has no 4.0 build in PMC.
  #   sdnotify-proxy   -> dropped from app-containers/docker (above).  Exists
  #                       only in-tree, never published to PMC.
  #
  # These five no longer need an in-tree build on 4.0 - Azure Linux 4 ships
  # them in the runtime 'base' repo, whereas 3.0 only has them in 'extended':
  #   microcode_ctl 2.1-71.1, stress-ng 0.20.01, Judy 1.0.5-43,
  #   libbsd 0.12.2-7, lksctp-tools 1.0.21.
  # microcode_ctl is therefore silently satisfied from base on 4.0; the other
  # four are only used by the lisa-testing sysext, which is not built here.
  #
  # Separately, these ship in the Azure Linux 3.0 'base' repo but have no 4.0
  # build at all, so they are not recoverable by rebuilding in-tree:
  #   coreos-cloudinit, update-ssh-keys, walinuxagent-acl-config
