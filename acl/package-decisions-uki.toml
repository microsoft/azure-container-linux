# Use alongside package-decisions-base.toml for UKI only.

["systemd-boot"]
decision = "keep"
# Payload: %files boot and its file splitter include bootloader and stub.
# https://github.com/microsoft/azurelinux/blob/a526a629b8ff3db2ec8a9633803506bd61118bca/SPECS/systemd/systemd.spec
# https://github.com/microsoft/azurelinux/blob/a526a629b8ff3db2ec8a9633803506bd61118bca/SPECS/systemd/split-files.py
# Consumers: UKI-mode package installation, stub input, and EFI loader copy.
# https://github.com/microsoft/azure-container-linux/blob/39668ce60123274ead5bf599e198f91edd04ff0d/build_library/prod_image_util.sh
# https://github.com/microsoft/azure-container-linux/blob/39668ce60123274ead5bf599e198f91edd04ff0d/build_library/rpm/uki_install.sh
# Activation: default UKI mode and finalizer selection of the UKI installer.
# https://github.com/microsoft/azure-container-linux/blob/39668ce60123274ead5bf599e198f91edd04ff0d/common.sh
# https://github.com/microsoft/azure-container-linux/blob/39668ce60123274ead5bf599e198f91edd04ff0d/build_library/build_image_util.sh
reason = """\
    Contains the systemd EFI bootloader and UKI stub. ACL's UKI assembly consumes both to deploy its EFI/UKI boot \
    chain."""

["trident-acl"]
decision = "keep"
# Payload: trident-acl-agent and its service; trident owns tridentd.socket.
# https://github.com/microsoft/azure-container-linux/blob/d93eab8bb13e571da5139054906f71b3fb65f14b/acl/SPECS/trident/trident.spec
# Consumer: the service executes the agent, which drives stage/finalize/rollback/commit.
# https://github.com/microsoft/trident/blob/v0.30.0/packaging/systemd/trident-acl-agent.service
# https://github.com/microsoft/trident/blob/v0.30.0/crates/trident-acl-agent/src/main.rs
# Activation scope: catalog selects trident-acl for UKI images and filters it from GRUB.
# https://github.com/microsoft/azure-container-linux/blob/d93eab8bb13e571da5139054906f71b3fb65f14b/build_library/rpm/package_catalog.sh
reason = """\
    Contains trident-acl-agent and its systemd service. Keep for UKI-ACL host servicing: the agent watches Kubernetes \
    update-request annotations and drives Trident staging, finalization, rollback, and commit."""

["shim"]
decision = "keep"
reason = 'Azure Linux 3.0 minimal-os (3.0.20260923) includes it.'
