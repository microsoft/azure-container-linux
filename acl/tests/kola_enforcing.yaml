# kola_enforcing.yaml — Enforced kola tests with structured exception rules.
#
# This is the source of truth for which kola tests are enforced. It is consumed
# directly by evaluate_test_results.sh with platform/arch/bootloader context.
#
# Each entry is a test name prefix. Tests matching any prefix must pass
# unless an exception rule applies to the current build context.
#
# Exception rules (all fields optional — omitted fields match anything):
#   platforms:         [qemu, azure]
#   architectures:     [amd64, aarch64]
#   bootloader:        [grub, uki]
#   imageVariants:     [acl, acl-t]
#   reason:            human-readable explanation
#
# Logic:
#   - Within a single rule, fields combine with AND (all must match).
#   - Across rules, they combine with OR (any matching rule allows failure).
#   - A test with no exceptions is always enforced.
#
# imageVariants notes:
#   - Callers that don't pass an --image-variant to evaluate_test_results.sh
#     get "acl" as the default (matches the stock acl build). acl-t stages
#     pass "acl-t" so the acl-t-only exceptions below apply.
#   - acl-t removes the docker CLI (moby-containerd RPM ships containerd/ctr
#     only) and drops both sysexts (containerd + oem-azure), so docker.* and
#     sysext.* tests have no viable target on acl-t.

version: 1

tests:
  - name: acl.basic
  - name: acl.etcd-member.discovery
    exceptions:
      - platforms: [qemu]
        architectures: [aarch64]
        reason: 3-node etcd cluster on TCG-emulated arm64 races systemd's DefaultDeviceTimeoutSec for /dev/disk/by-label/OEM; tracked by the OEM fsck conditional dropin work
      - platforms: [azure]
        reason: Azure version depends on discovery.etcd.io, which is unmaintained.
      - imageVariants: [acl-t]
        reason: etcd-member ships as a sysext on stock acl; acl-t drops the containerd/oem sysexts and does not ship etcd-member as an RPM. No viable target.

  - name: acl.flannel.udp
    exceptions:
      - architectures: [aarch64]
        reason: Flannel UDP coverage is registered only for amd64
      - platforms: [azure]
        reason: Azure version depends on discovery.etcd.io, which is unmaintained.
      - imageVariants: [acl-t]
        reason: flannel-docker sysext removed on acl-t (moby-containerd RPM replaces containerd sysext but ships no flannel bits).
  - name: acl.flannel.vxlan
    exceptions:
      - platforms: [qemu]
        architectures: [aarch64]
        reason: Flakiness on TCG-emulated arm64 in aclmain, failures due to slow device enumeration.
      - platforms: [azure]
        reason: Azure version depends on discovery.etcd.io, which is unmaintained.
      - imageVariants: [acl-t]
        reason: flannel-docker sysext removed on acl-t (moby-containerd RPM replaces containerd sysext but ships no flannel bits).

  - name: acl.internet
    exceptions:
      - platforms: [qemu]
        reason: Requires real network connectivity (Azure only)
      - platforms: [azure]
        reason: |
          TEMPORARY (AB#20102): DockerPing fails because kola Azure VMs no longer
          have a Public IP (mantle PR 27413), and Azure default outbound access
          does not SNAT ICMP. Revert once mantle/infra restores outbound ICMP
          (NSG-on-NIC keeping the PIP, or a NAT Gateway on the kola subnet).
      - imageVariants: [acl-t]
        reason: |
          All three subtests are non-viable on acl-t: DockerPing/DockerEcho
          need the docker CLI (moby-containerd ships containerd/ctr only),
          and NTPDate needs ntpdate (chrony is acl-t's time daemon; same
          reason as linux.ntp).

  # TEMPORARY (AB#22249): acl.kdump and acl.kdump.grub are disabled on the ACL
  # distro in mantle (ExcludeDistros: [acl]), so kola never selects them and the
  # "enforced test NOT SELECTED" check fails. Restore both entries when the
  # mantle-side ExcludeDistros is dropped.
  # - name: acl.kdump
  #   exceptions:
  #     - bootloader: [grub]
  #       reason: acl.kdump requires UKI boot (addon-based crashkernel)
  #
  # - name: acl.kdump.grub
  #   exceptions:
  #     - platforms: [azure]
  #       reason: writing /oem/grub.cfg does not persist across reboot on cloud platforms.
  #     - bootloader: [uki]
  #       reason: acl.kdump.grub is for GRUB images only

  - name: acl.ignition.v1.users
  - name: acl.ignition.v2.users

  - name: bpf.execsnoop
    exceptions:
      - imageVariants: [acl-t]
        reason: |
          Test uses `docker run` (NeedsDocker). On ACL, mantle injects
          the docker sysext at test time (platform/cluster.go). acl-t
          ships no docker RPM and replaces the containerd sysext with
          moby-containerd (containerd/ctr only) — nothing to inject.
  - name: bpf.local-gadget
    exceptions:
      - imageVariants: [acl-t]
        reason: |
          local-gadget.service and its binary come from the test's
          Ignition, not a sysext. Failure is local-gadget itself
          speaking the Docker API (NeedsDocker). Same root cause as
          bpf.execsnoop: no docker on acl-t.

