  - name: docker.containerd-restart
    exceptions:
      - imageVariants: [acl-t]
        reason: |
          Test drives the docker CLI to restart containerd; acl-t has no
          docker CLI (moby-containerd RPM ships containerd/ctr only).
          Direct containerd-restart coverage on acl-t is tracked as a
          follow-up (new `containerd.*` mantle tests using ctr).
  - name: docker.enable-service.sysext
    exceptions:
      - imageVariants: [acl-t]
        reason: acl-t has no docker sysext to enable — containerd is a first-class RPM, not a sysext.
  - name: docker.selinux
    exceptions:
      - platforms: [qemu]
        architectures: [aarch64]
        reason: Slow emulation causes this test to hit the duplicate journal entry bug (azure coverage doesn't exhibit this)
      - imageVariants: [acl-t]
