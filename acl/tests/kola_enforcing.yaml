# kola_enforcing.yaml — Enforced kola tests with structured exception rules.
#
# This is the source of truth for which kola tests are enforced. The legacy
# text files (kola_enforcing.txt, kola_enforcing_exceptions_*.txt) remain for
# backward compatibility but should be generated from this file.
#
# Each entry is a test name prefix. Tests matching any prefix must pass
# unless an exception rule applies to the current build context.
#
# Exception rules (all fields optional — omitted fields match anything):
#   platforms:         [qemu, azure]
#   architectures:     [amd64, aarch64]
#   bootloader:        [grub, uki]
#   reason:            human-readable explanation
#
# Logic:
#   - Within a single rule, fields combine with AND (all must match).
#   - Across rules, they combine with OR (any matching rule allows failure).
#   - A test with no exceptions is always enforced.

