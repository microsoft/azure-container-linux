# kola_enforcing.yaml — Enforced kola tests with structured exception rules.
#
# This is the source of truth for which kola tests are enforced. It is consumed
# directly by evaluate_test_results.sh with platform/arch/bootloader context.
#
# Each entry is a test name prefix. Tests matching any prefix must pass
# unless an exception rule applies to the current build context.
#
# Exception rules (all fields optional — omitted fields match anything):
#   platforms:         [qemu, azure]
#   architectures:     [amd64, aarch64]
#   bootloader:        [grub, uki]
#   reason:            human-readable explanation
#
# Logic:
#   - Within a single rule, fields combine with AND (all must match).
#   - Across rules, they combine with OR (any matching rule allows failure).
#   - A test with no exceptions is always enforced.

version: 1

tests:
  - name: acl.basic
  - name: acl.etcd-member.discovery

  - name: acl.flannel.udp
    exceptions:
      - architectures: [aarch64]
        reason: Flannel UDP coverage is registered only for amd64
  - name: acl.flannel.vxlan

  - name: acl.internet
    exceptions:
      - platforms: [qemu]
        reason: Requires real network connectivity (Azure only)

  - name: acl.ignition.v1.users
  - name: acl.ignition.v2.users

  - name: bpf.execsnoop
  - name: bpf.local-gadget

  - name: cl.cloudinit.basic
  - name: cl.cloudinit.multipart-mime
  - name: cl.cloudinit.script

  - name: acl.disk.raid0.data
    exceptions:
      - platforms: [azure]
        reason: ACL data RAID coverage uses a secondary disk, which this Kola test only provisions on QEMU
  - name: acl.disk.raid0.root
    exceptions:
      - platforms: [azure]
        reason: Root RAID coverage requires an additional disk, which this Kola test only provisions on QEMU
      - bootloader: [grub]
        reason: Mantle hardcodes UKI partition layout (part5); GRUB uses part9
  - name: acl.disk.raid1.data
    exceptions:
      - platforms: [azure]
        reason: ACL data RAID coverage uses a secondary disk, which this Kola test only provisions on QEMU
  - name: acl.disk.raid1.root
    exceptions:
      - platforms: [azure]
        reason: Root RAID coverage requires an additional disk, which this Kola test only provisions on QEMU
      - bootloader: [grub]
        reason: Mantle hardcodes UKI partition layout (part5); GRUB uses part9

  - name: cl.etcd-member.etcdctlv3
  - name: cl.etcd-member.v2-backup-restore

  - name: cl.filesystem
    exceptions:
      - platforms: [azure]
        reason: Filesystem audit is not cloud-environment coverage and is limited to QEMU contexts

  - name: cl.ignition.instantiated.enable-unit
    exceptions:
      - platforms: [azure]
        reason: Instantiated unit enablement coverage is not cloud-environment coverage and is limited to QEMU contexts
  - name: cl.ignition.kargs
    exceptions:
      - bootloader: [uki]
        reason: Dynamic kargs writing is not supported with UKI's immutable bootloader configuration
  - name: cl.ignition.luks
  - name: cl.ignition.oem.indirect
    exceptions:
      - platforms: [azure]
        reason: Test rewrites OEM grub.cfg, which does not survive cloud-platform reboot semantics
  - name: cl.ignition.oem.indirect.new
    exceptions:
      - platforms: [azure]
        reason: Test rewrites OEM grub.cfg, which does not survive cloud-platform reboot semantics
  - name: cl.ignition.oem.regular
    exceptions:
      - platforms: [azure]
        reason: Test rewrites OEM grub.cfg, which does not survive cloud-platform reboot semantics
  - name: cl.ignition.oem.regular.new
    exceptions:
      - platforms: [azure]
        reason: Test rewrites OEM grub.cfg, which does not survive cloud-platform reboot semantics
  - name: cl.ignition.oem.reuse
    exceptions:
      - platforms: [azure]
        reason: Test rewrites OEM grub.cfg, which does not survive cloud-platform reboot semantics
  - name: cl.ignition.oem.wipe
    exceptions:
      - platforms: [azure]
        reason: Wiping the OEM filesystem can prevent non-QEMU platforms from booting after reboot
  - name: cl.ignition.partition_on_boot_disk
    exceptions:
      - platforms: [azure]
        reason: Test repartitions the boot disk and is limited to QEMU disk-layout coverage
  - name: cl.ignition.symlink
  - name: cl.ignition.translation
  - name: cl.ignition.v1.btrfsroot
  - name: cl.ignition.v1.ext4root
  - name: cl.ignition.v1.groups
  - name: cl.ignition.v1.once
  - name: cl.ignition.v1.sethostname
    exceptions:
      - platforms: [azure]
        reason: Azure requires hostname at instance creation and waagent can overwrite Ignition-set hostnames after boot
  - name: cl.ignition.v1.xfsroot
  - name: cl.ignition.v2.btrfsroot
  - name: cl.ignition.v2.ext4root
  - name: cl.ignition.v2.xfsroot
  - name: cl.ignition.v2_1.ext4checkexisting
  - name: cl.ignition.v2_1.swap
  - name: cl.ignition.v2_1.vfat

  - name: cl.install.cloudinit
    exceptions:
      - platforms: [azure]
        reason: Test expects installer-written cloud-config to own hostname, which conflicts with Azure hostname handling

  - name: acl.network.initramfs.second-boot
    exceptions:
      - platforms: [azure]
        reason: SELinux toggle reaches out to IMDS on second boot too
  - name: cl.network.iptables
  - name: cl.network.listeners
    exceptions:
      - platforms: [azure]
        reason: Listener audit is not cloud-environment coverage unless OEM tools unexpectedly open ports
  - name: cl.network.nftables
  - name: cl.network.wireguard

  - name: cl.swap_activation
  - name: cl.sysext.boot
    exceptions:
      - platforms: [azure]
        reason: Test uses custom OEM files and should not run on cloud platforms
  - name: cl.users.shells
  - name: cl.verity

  - name: coreos.auth.verify
  - name: coreos.ignition.groups
  - name: coreos.ignition.once
  - name: coreos.ignition.resource.local
  - name: coreos.ignition.resource.remote
  - name: coreos.ignition.resource.s3.versioned
    exceptions:
      - platforms: [azure]
        reason: Versioned S3 resource coverage is a special case of remote-resource ignition coverage and is limited to QEMU
  - name: coreos.ignition.security.tls
  - name: coreos.ignition.sethostname
    exceptions:
      - platforms: [azure]
        reason: Azure requires hostname at instance creation and waagent can overwrite Ignition-set hostnames after boot
  - name: coreos.ignition.systemd.enable-service
  - name: coreos.selinux.boolean
  - name: coreos.tls.fetch-urls

  - name: docker.base
  - name: docker.btrfs-storage
  - name: docker.containerd-restart
  - name: docker.enable-service.sysext
  - name: docker.selinux
  - name: docker.userns

  - name: kubeadm.v1.32.4.calico.base
