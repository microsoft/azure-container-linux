  - name: kubeadm.v1.33.0.calico.base
    exceptions:
      - platforms: [qemu]
        architectures: [aarch64]
        reason: kubectl wait timeouts on emulated arm64 QEMU
  - name: kubeadm.v1.33.0.cilium.base
    exceptions:
      - platforms: [qemu]
        architectures: [aarch64]
        reason: kubectl wait timeouts on emulated arm64 QEMU
  - name: kubeadm.v1.33.0.flannel.base
    exceptions:
      - platforms: [qemu]
        architectures: [aarch64]
        reason: kubectl wait timeouts on emulated arm64 QEMU
  - name: kubeadm.v1.34.1.calico.base
    exceptions:
      - platforms: [qemu]
        architectures: [aarch64]
        reason: kubectl wait timeouts on emulated arm64 QEMU
  - name: kubeadm.v1.34.1.cilium.base
    exceptions:
      - platforms: [qemu]
        architectures: [aarch64]
        reason: kubectl wait timeouts on emulated arm64 QEMU
  - name: kubeadm.v1.34.1.flannel.base
