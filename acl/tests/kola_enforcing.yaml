  - name: linux.nfs.v3
    exceptions:
      - platforms: [azure]
        reason: Test requires hostname control that conflicts with Azure instance-level hostname handling
      - imageVariants: [acl-t]
        reason: nfs-server.service and rpc-statd.service come up failed at basic-check on acl-t (kola-qemu). NFS server-side wiring on acl-t is not covered — no viable target until the RPM units are pulled in.
  - name: linux.nfs.v4
    exceptions:
      - platforms: [azure]
        reason: Test requires hostname control that conflicts with Azure instance-level hostname handling
      - imageVariants: [acl-t]
        reason: nfs-server.service and rpc-statd.service come up failed at basic-check on acl-t (kola-qemu). NFS server-side wiring on acl-t is not covered — no viable target until the RPM units are pulled in.
  - name: linux.ntp
    exceptions:
      - platforms: [azure]
        reason: Test starts a local NTP server, so it is not cloud-environment coverage
      - imageVariants: [acl-t]
        reason: |
          Test hardcodes systemd-timesyncd (mantle kola/tests/misc/ntp.go
          waits for "Synchronized to time server"). acl-t ships chronyd
          (Azure/WALinuxAgent stack) and disables timesyncd via chrony
          RPM %post. Coverage on acl-t is via acl.basic/ServicesActive,
          which uses the timesyncd/chronyd/ntpd anyOf pattern.

  - name: sysext.custom-docker.sysext
    exceptions:
      - imageVariants: [acl-t]
        reason: acl-t has no docker sysext infrastructure — containerd is a first-class RPM, so there is no docker sysext to customize.
  - name: sysext.disable-containerd
    exceptions:
      - imageVariants: [acl-t]
        reason: acl-t drops the containerd sysext (moby-containerd RPM replaces it); nothing to disable.
  - name: sysext.disable-docker
    exceptions:
      - imageVariants: [acl-t]
        reason: acl-t drops the docker/containerd sysexts (RPMs replace them); nothing to disable.
  - name: sysext.simple
    exceptions:
      - imageVariants: [acl-t]
        reason: acl-t ships no sysexts at all — containerd + oem-azure are replaced by first-class RPMs, so there is no sysext to exercise.

