<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1660" viewBox="0 0 1440 1660" role="img" aria-labelledby="title desc">
  <title id="title">ACL execution and OS-disk performance</title>
  <desc id="desc">Execution latency and node OS-disk read and write IOPS for the base ACL image, overlayfs with IPE assets, prebuilt EROFS referrers, and tar-index EROFS referrers.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #475569; }
    .panel-title { font-size: 22px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 14px; fill: #4b5563; }
    .value { font-size: 14px; font-weight: 700; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .grid { stroke: #d8dee9; stroke-width: 1; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .baseline { fill: #6b7280; }
    .overlay { fill: #16a34a; }
    .prebuilt { fill: #d97706; }
    .erofs { fill: #7c3aed; }
  </style>

  <rect width="1440" height="1660" fill="#f8fafc"/>
  <text x="60" y="58" class="title">ACL execution and OS-disk performance</text>
  <text x="60" y="88" class="subtitle">Bars show means. n is the number of timed calls, execution groups, or node-level fio jobs.</text>

  <rect x="70" y="112" width="18" height="18" rx="3" class="baseline"/>
  <text x="98" y="126" class="label">Base ACL image</text>
  <rect x="350" y="112" width="18" height="18" rx="3" class="overlay"/>
  <text x="378" y="126" class="label">Overlayfs + IPE assets</text>
  <rect x="710" y="112" width="18" height="18" rx="3" class="prebuilt"/>
  <text x="738" y="126" class="label">Prebuilt EROFS referrers</text>
  <rect x="1070" y="112" width="18" height="18" rx="3" class="erofs"/>
  <text x="1098" y="126" class="label">Tar-index EROFS referrers</text>

  <rect x="50" y="160" width="1340" height="350" rx="10" class="panel"/>
  <text x="75" y="197" class="panel-title">A. User-visible Kubernetes exec latency</text>
  <text x="75" y="223" class="small">One sample is one fresh kubectl exec /bin/true. Base, Overlayfs, and tar-index n=40. Prebuilt n=20.</text>

  <line x1="390" y1="250" x2="390" y2="410" class="axis"/>
  <line x1="602.5" y1="250" x2="602.5" y2="410" class="grid"/>
  <line x1="815" y1="250" x2="815" y2="410" class="grid"/>
  <line x1="1027.5" y1="250" x2="1027.5" y2="410" class="grid"/>
  <line x1="1240" y1="250" x2="1240" y2="410" class="grid"/>

  <text x="370" y="276" text-anchor="end" class="label">Base ACL image</text>
  <rect x="390" y="258" width="673.9" height="24" rx="3" class="baseline"/>
  <text x="1074" y="276" class="value">237.835 ms</text>
  <text x="370" y="318" text-anchor="end" class="label">Overlayfs + IPE assets</text>
  <rect x="390" y="300" width="668.5" height="24" rx="3" class="overlay"/>
  <text x="1069" y="318" class="value">235.935 ms (-0.80%)</text>
  <text x="370" y="360" text-anchor="end" class="label">Prebuilt EROFS referrers</text>
  <rect x="390" y="342" width="662.7" height="24" rx="3" class="prebuilt"/>
  <text x="1063" y="360" class="value">233.888 ms (-1.66%)</text>
  <text x="370" y="402" text-anchor="end" class="label">Tar-index EROFS referrers</text>
  <rect x="390" y="384" width="674.2" height="24" rx="3" class="erofs"/>
  <text x="1075" y="402" class="value">237.960 ms (+0.05%)</text>

  <text x="390" y="455" text-anchor="middle" class="small">0 ms</text>
  <text x="602.5" y="455" text-anchor="middle" class="small">75</text>
  <text x="815" y="455" text-anchor="middle" class="small">150</text>
  <text x="1027.5" y="455" text-anchor="middle" class="small">225</text>
  <text x="1240" y="455" text-anchor="middle" class="small">300 ms</text>

  <rect x="50" y="540" width="1340" height="350" rx="10" class="panel"/>
  <text x="75" y="577" class="panel-title">B. Host-local /bin/true execution</text>
  <text x="75" y="603" class="small">Base, Overlayfs, and tar-index ran 200,000 executions in 100 groups. Prebuilt ran 100,000 in 50 groups.</text>

  <line x1="390" y1="630" x2="390" y2="790" class="axis"/>
  <line x1="602.5" y1="630" x2="602.5" y2="790" class="grid"/>
  <line x1="815" y1="630" x2="815" y2="790" class="grid"/>
  <line x1="1027.5" y1="630" x2="1027.5" y2="790" class="grid"/>
  <line x1="1240" y1="630" x2="1240" y2="790" class="grid"/>

  <text x="370" y="656" text-anchor="end" class="label">Base ACL image</text>
  <rect x="390" y="638" width="358.9" height="24" rx="3" class="baseline"/>
  <text x="760" y="656" class="value">675.542 us</text>
  <text x="370" y="698" text-anchor="end" class="label">Overlayfs + IPE assets</text>
  <rect x="390" y="680" width="365.2" height="24" rx="3" class="overlay"/>
  <text x="767" y="698" class="value">687.416 us (+1.76%)</text>
  <text x="370" y="740" text-anchor="end" class="label">Prebuilt EROFS referrers</text>
  <rect x="390" y="722" width="761.5" height="24" rx="3" class="prebuilt"/>
  <text x="1163" y="740" class="value">1,433.491 us (+112.20%)</text>
  <text x="370" y="782" text-anchor="end" class="label">Tar-index EROFS referrers</text>
  <rect x="390" y="764" width="319.2" height="24" rx="3" class="erofs"/>
  <text x="720" y="782" class="value">600.784 us (-11.07%)</text>

  <text x="390" y="835" text-anchor="middle" class="small">0 us</text>
  <text x="602.5" y="835" text-anchor="middle" class="small">400</text>
  <text x="815" y="835" text-anchor="middle" class="small">800</text>
  <text x="1027.5" y="835" text-anchor="middle" class="small">1,200</text>
  <text x="1240" y="835" text-anchor="middle" class="small">1,600 us</text>

  <rect x="50" y="920" width="1340" height="330" rx="10" class="panel"/>
  <text x="75" y="957" class="panel-title">C. Node OS-disk read IOPS</text>
  <text x="75" y="983" class="small">Each row runs one 120-second fio job per node after a 2-second ramp: 4 KiB direct I/O, 8 GiB file, queue depth 32.</text>
  <text x="75" y="1005" class="small">Node-level jobs per row: Base n=3, Overlayfs n=3, prebuilt n=1, tar-index n=3.</text>

  <line x1="390" y1="1025" x2="390" y2="1175" class="axis"/>
  <line x1="602.5" y1="1025" x2="602.5" y2="1175" class="grid"/>
  <line x1="815" y1="1025" x2="815" y2="1175" class="grid"/>
  <line x1="1027.5" y1="1025" x2="1027.5" y2="1175" class="grid"/>
  <line x1="1240" y1="1025" x2="1240" y2="1175" class="grid"/>

  <text x="75" y="1055" class="label">Sequential read</text>
  <rect x="390" y="1037" width="826.9" height="16" rx="3" class="baseline"/>
  <rect x="390" y="1059" width="831.7" height="16" rx="3" class="overlay"/>
  <rect x="390" y="1081" width="820.9" height="16" rx="3" class="prebuilt"/>
  <rect x="390" y="1103" width="823.1" height="16" rx="3" class="erofs"/>
  <text x="1360" y="1050" text-anchor="end" class="value">19,455.698</text>
  <text x="1360" y="1072" text-anchor="end" class="value">19,569.740 (+0.59%)</text>
  <text x="1360" y="1094" text-anchor="end" class="value">19,314.945 (-0.72%)</text>
  <text x="1360" y="1116" text-anchor="end" class="value">19,368.207 (-0.45%)</text>

  <text x="75" y="1145" class="label">Random read</text>
  <rect x="390" y="1127" width="830.9" height="16" rx="3" class="baseline"/>
  <rect x="390" y="1149" width="804.7" height="16" rx="3" class="overlay"/>
  <rect x="390" y="1171" width="818.5" height="16" rx="3" class="prebuilt"/>
  <rect x="390" y="1193" width="817.0" height="16" rx="3" class="erofs"/>
  <text x="1360" y="1140" text-anchor="end" class="value">19,549.872</text>
  <text x="1360" y="1162" text-anchor="end" class="value">18,933.476 (-3.15%)</text>
  <text x="1360" y="1184" text-anchor="end" class="value">19,259.203 (-1.49%)</text>
  <text x="1360" y="1206" text-anchor="end" class="value">19,224.276 (-1.67%)</text>

  <text x="390" y="1225" text-anchor="middle" class="small">0</text>
  <text x="602.5" y="1225" text-anchor="middle" class="small">5k</text>
  <text x="815" y="1225" text-anchor="middle" class="small">10k</text>
  <text x="1027.5" y="1225" text-anchor="middle" class="small">15k</text>
  <text x="1240" y="1225" text-anchor="middle" class="small">20k IOPS</text>

  <rect x="50" y="1280" width="1340" height="340" rx="10" class="panel"/>
  <text x="75" y="1317" class="panel-title">D. Node OS-disk write IOPS</text>
  <text x="75" y="1343" class="small">Each row runs one 120-second fio job per node after a 2-second ramp: 4 KiB direct I/O, 8 GiB file, queue depth 32.</text>
  <text x="75" y="1365" class="small">Node-level jobs per row: Base n=3, Overlayfs n=3, prebuilt n=1, tar-index n=2.</text>

  <line x1="390" y1="1385" x2="390" y2="1545" class="axis"/>
  <line x1="602.5" y1="1385" x2="602.5" y2="1545" class="grid"/>
  <line x1="815" y1="1385" x2="815" y2="1545" class="grid"/>
  <line x1="1027.5" y1="1385" x2="1027.5" y2="1545" class="grid"/>
  <line x1="1240" y1="1385" x2="1240" y2="1545" class="grid"/>

  <text x="75" y="1415" class="label">Sequential write</text>
  <rect x="390" y="1397" width="754.2" height="16" rx="3" class="baseline"/>
  <rect x="390" y="1419" width="533.5" height="16" rx="3" class="overlay"/>
  <rect x="390" y="1441" width="558.6" height="16" rx="3" class="prebuilt"/>
  <rect x="390" y="1463" width="752.2" height="16" rx="3" class="erofs"/>
  <text x="1360" y="1410" text-anchor="end" class="value">3,548.985</text>
  <text x="1360" y="1432" text-anchor="end" class="value">2,510.520 (-29.26%)</text>
  <text x="1360" y="1454" text-anchor="end" class="value">2,628.773 (-25.93%)</text>
  <text x="1360" y="1476" text-anchor="end" class="value">3,539.640 (-0.26%)</text>

  <text x="75" y="1505" class="label">Random write</text>
  <rect x="390" y="1487" width="725.1" height="16" rx="3" class="baseline"/>
  <rect x="390" y="1509" width="604.6" height="16" rx="3" class="overlay"/>
  <rect x="390" y="1531" width="745.1" height="16" rx="3" class="prebuilt"/>
  <rect x="390" y="1553" width="747.4" height="16" rx="3" class="erofs"/>
  <text x="1360" y="1500" text-anchor="end" class="value">3,412.007</text>
  <text x="1360" y="1522" text-anchor="end" class="value">2,845.111 (-16.61%)</text>
  <text x="1360" y="1544" text-anchor="end" class="value">3,506.154 (+2.76%)</text>
  <text x="1360" y="1566" text-anchor="end" class="value">3,517.186 (+3.08%)</text>

  <text x="390" y="1595" text-anchor="middle" class="small">0</text>
  <text x="602.5" y="1595" text-anchor="middle" class="small">1k</text>
  <text x="815" y="1595" text-anchor="middle" class="small">2k</text>
  <text x="1027.5" y="1595" text-anchor="middle" class="small">3k</text>
  <text x="1240" y="1595" text-anchor="middle" class="small">4k IOPS</text>
</svg>
