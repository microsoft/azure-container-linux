<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230" viewBox="0 0 1440 1230" role="img" aria-labelledby="title desc">
  <title id="title">Signed container lifecycle</title>
  <desc id="desc">Signed one-layer and eight-layer lifecycle means for the base ACL image, overlayfs with IPE assets, prebuilt EROFS referrers, and tar-index EROFS referrers.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #475569; }
    .panel-title { font-size: 22px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 14px; fill: #4b5563; }
    .passive-delta { font-size: 13px; font-weight: 700; fill: #166534; }
    .prebuilt-delta { font-size: 13px; font-weight: 700; fill: #9a3412; }
    .erofs-delta { font-size: 13px; font-weight: 700; fill: #581c87; }
    .na { font-size: 13px; font-style: italic; fill: #64748b; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .grid { stroke: #d8dee9; stroke-width: 1; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .base { fill: #6b7280; }
    .overlay { fill: #16a34a; }
    .prebuilt { fill: #d97706; }
    .erofs { fill: #7c3aed; }
  </style>

  <rect width="1440" height="1230" fill="#f8fafc"/>
  <text x="60" y="55" class="title">Signed container lifecycle</text>
  <text x="60" y="84" class="subtitle">Pod starts: Base, Overlayfs, and tar-index n=60. Prebuilt n=30. Prebuilt acquisition n=10.</text>

  <rect x="70" y="110" width="18" height="18" rx="3" class="base"/>
  <text x="98" y="124" class="label">Base ACL image</text>
  <rect x="350" y="110" width="18" height="18" rx="3" class="overlay"/>
  <text x="378" y="124" class="label">Overlayfs + IPE assets</text>
  <rect x="710" y="110" width="18" height="18" rx="3" class="prebuilt"/>
  <text x="738" y="124" class="label">Prebuilt EROFS referrers</text>
  <rect x="1070" y="110" width="18" height="18" rx="3" class="erofs"/>
  <text x="1098" y="124" class="label">Tar-index EROFS referrers</text>

  <rect x="50" y="160" width="1340" height="500" rx="10" class="panel"/>
  <text x="75" y="197" class="panel-title">A. One-layer signed image</text>
  <text x="75" y="223" class="small">Values are gray / green / orange / purple means. The historical prebuilt image had no signed one-layer fixture.</text>

  <line x1="435" y1="250" x2="435" y2="600" class="axis"/>
  <line x1="598" y1="250" x2="598" y2="600" class="grid"/>
  <line x1="761" y1="250" x2="761" y2="600" class="grid"/>
  <line x1="924" y1="250" x2="924" y2="600" class="grid"/>
  <line x1="1087" y1="250" x2="1087" y2="600" class="grid"/>
  <line x1="1250" y1="250" x2="1250" y2="600" class="grid"/>

  <text x="75" y="275" class="label">Cold pod start</text>
  <text x="75" y="297" class="small">3.605 / 3.698 / N/A / 4.339 s</text>
  <rect x="435" y="255" width="293.8" height="16" rx="3" class="base"/>
  <rect x="435" y="277" width="301.4" height="16" rx="3" class="overlay"/>
  <text x="745" y="290" class="passive-delta">+2.58%</text>
  <rect x="435" y="299" width="353.6" height="16" rx="3" class="erofs"/>
  <text x="797" y="312" class="erofs-delta">+20.37%</text>

  <text x="75" y="365" class="label">Cached pod start</text>
  <text x="75" y="387" class="small">1.492 / 1.231 / N/A / 1.522 s</text>
  <rect x="435" y="345" width="121.6" height="16" rx="3" class="base"/>
  <rect x="435" y="367" width="100.3" height="16" rx="3" class="overlay"/>
  <text x="544" y="380" class="passive-delta">-17.51%</text>
  <rect x="435" y="389" width="124.1" height="16" rx="3" class="erofs"/>
  <text x="567" y="402" class="erofs-delta">+2.04%</text>

  <text x="75" y="455" class="label">Always-pull pod start</text>
  <text x="75" y="477" class="small">1.994 / 2.061 / N/A / 3.563 s</text>
  <rect x="435" y="435" width="162.5" height="16" rx="3" class="base"/>
  <rect x="435" y="457" width="168.0" height="16" rx="3" class="overlay"/>
  <text x="611" y="470" class="passive-delta">+3.37%</text>
  <rect x="435" y="479" width="290.4" height="16" rx="3" class="erofs"/>
  <text x="733" y="492" class="erofs-delta">+78.69%</text>

  <text x="75" y="545" class="label">Cold image acquisition</text>
  <text x="75" y="567" class="small">1.751 / 1.813 / N/A / 2.422 s</text>
  <rect x="435" y="525" width="142.7" height="16" rx="3" class="base"/>
  <rect x="435" y="547" width="147.8" height="16" rx="3" class="overlay"/>
  <text x="591" y="560" class="passive-delta">+3.56%</text>
  <rect x="435" y="569" width="197.4" height="16" rx="3" class="erofs"/>
  <text x="640" y="582" class="erofs-delta">+38.27%</text>

  <text x="435" y="635" text-anchor="middle" class="small">0 s</text>
  <text x="598" y="635" text-anchor="middle" class="small">2</text>
  <text x="761" y="635" text-anchor="middle" class="small">4</text>
  <text x="924" y="635" text-anchor="middle" class="small">6</text>
  <text x="1087" y="635" text-anchor="middle" class="small">8</text>
  <text x="1250" y="635" text-anchor="middle" class="small">10 s</text>

  <rect x="50" y="690" width="1340" height="510" rx="10" class="panel"/>
  <text x="75" y="727" class="panel-title">B. Eight-layer signed image</text>
  <text x="75" y="753" class="small">Values are gray / green / orange / purple means. The historical prebuilt run did not measure always-pull startup.</text>

  <line x1="435" y1="780" x2="435" y2="1140" class="axis"/>
  <line x1="609.6" y1="780" x2="609.6" y2="1140" class="grid"/>
  <line x1="784.3" y1="780" x2="784.3" y2="1140" class="grid"/>
  <line x1="958.9" y1="780" x2="958.9" y2="1140" class="grid"/>
  <line x1="1133.6" y1="780" x2="1133.6" y2="1140" class="grid"/>
  <line x1="1250" y1="780" x2="1250" y2="1140" class="grid"/>

  <text x="75" y="815" class="label">Cold pod start</text>
  <text x="75" y="837" class="small">4.572 / 4.643 / 11.699 / 9.917 s</text>
  <rect x="435" y="798" width="266.2" height="16" rx="3" class="base"/>
  <rect x="435" y="820" width="270.3" height="16" rx="3" class="overlay"/>
  <text x="714" y="833" class="passive-delta">+1.56%</text>
  <rect x="435" y="842" width="681.0" height="16" rx="3" class="prebuilt"/>
  <text x="1125" y="855" class="prebuilt-delta">+155.89%</text>
  <rect x="435" y="864" width="577.4" height="16" rx="3" class="erofs"/>
  <text x="1021" y="877" class="erofs-delta">+116.93%</text>

  <text x="75" y="900" class="label">Cached pod start</text>
  <text x="75" y="922" class="small">1.409 / 1.215 / 3.536 / 1.377 s</text>
  <rect x="435" y="883" width="82.0" height="16" rx="3" class="base"/>
  <rect x="435" y="905" width="70.7" height="16" rx="3" class="overlay"/>
  <text x="514" y="918" class="passive-delta">-13.80%</text>
  <rect x="435" y="927" width="205.9" height="16" rx="3" class="prebuilt"/>
  <text x="649" y="940" class="prebuilt-delta">+150.96%</text>
  <rect x="435" y="949" width="80.2" height="16" rx="3" class="erofs"/>
  <text x="523" y="962" class="erofs-delta">-2.25%</text>

  <text x="75" y="985" class="label">Always-pull pod start</text>
  <text x="75" y="1007" class="small">2.056 / 2.109 / N/A / 7.399 s</text>
  <rect x="435" y="968" width="119.7" height="16" rx="3" class="base"/>
  <rect x="435" y="990" width="122.7" height="16" rx="3" class="overlay"/>
  <text x="566" y="1003" class="passive-delta">+2.56%</text>
  <rect x="435" y="1012" width="430.7" height="16" rx="3" class="erofs"/>
  <text x="874" y="1025" class="erofs-delta">+259.80%</text>

  <text x="75" y="1070" class="label">Cold image acquisition</text>
  <text x="75" y="1092" class="small">2.784 / 2.652 / 7.473 / 7.643 s</text>
  <rect x="435" y="1053" width="162.1" height="16" rx="3" class="base"/>
  <rect x="435" y="1075" width="154.4" height="16" rx="3" class="overlay"/>
  <text x="598" y="1088" class="passive-delta">-4.75%</text>
  <rect x="435" y="1097" width="435.0" height="16" rx="3" class="prebuilt"/>
  <text x="878" y="1110" class="prebuilt-delta">+168.42%</text>
  <rect x="435" y="1119" width="444.9" height="16" rx="3" class="erofs"/>
  <text x="888" y="1132" class="erofs-delta">+174.55%</text>

  <text x="435" y="1165" text-anchor="middle" class="small">0 s</text>
  <text x="609.6" y="1165" text-anchor="middle" class="small">3</text>
  <text x="784.3" y="1165" text-anchor="middle" class="small">6</text>
  <text x="958.9" y="1165" text-anchor="middle" class="small">9</text>
  <text x="1133.6" y="1165" text-anchor="middle" class="small">12</text>
  <text x="1250" y="1165" text-anchor="middle" class="small">14 s</text>
</svg>
