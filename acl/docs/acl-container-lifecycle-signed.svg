<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1150" viewBox="0 0 1440 1150" role="img" aria-labelledby="title desc">
  <title id="title">Signed container lifecycle</title>
  <desc id="desc">Signed one-layer and eight-layer lifecycle means for the base ACL image, overlayfs with IPE assets, and EROFS with IPE auditing.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #475569; }
    .panel-title { font-size: 22px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 14px; fill: #4b5563; }
    .passive-delta { font-size: 13px; font-weight: 700; fill: #166534; }
    .erofs-delta { font-size: 13px; font-weight: 700; fill: #581c87; }
    .na { font-size: 13px; font-style: italic; fill: #64748b; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .grid { stroke: #d8dee9; stroke-width: 1; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .base { fill: #6b7280; }
    .overlay { fill: #16a34a; }
    .erofs { fill: #7c3aed; }
  </style>

  <rect width="1440" height="1150" fill="#f8fafc"/>
  <text x="60" y="55" class="title">Signed container lifecycle</text>
  <text x="60" y="84" class="subtitle">Bars show means. Base and EROFS use n=60. Overlayfs + IPE assets uses n=20 where shown.</text>

  <rect x="70" y="110" width="18" height="18" rx="3" class="base"/>
  <text x="98" y="124" class="label">Base ACL image</text>
  <rect x="500" y="110" width="18" height="18" rx="3" class="overlay"/>
  <text x="528" y="124" class="label">Overlayfs + IPE assets</text>
  <rect x="990" y="110" width="18" height="18" rx="3" class="erofs"/>
  <text x="1018" y="124" class="label">EROFS + IPE auditing</text>

  <rect x="50" y="160" width="1340" height="420" rx="10" class="panel"/>
  <text x="75" y="197" class="panel-title">A. One-layer signed image</text>
  <text x="75" y="223" class="small">The older Overlayfs + IPE assets image did not include a signed one-layer fixture.</text>

  <line x1="435" y1="250" x2="435" y2="500" class="axis"/>
  <line x1="598" y1="250" x2="598" y2="500" class="grid"/>
  <line x1="761" y1="250" x2="761" y2="500" class="grid"/>
  <line x1="924" y1="250" x2="924" y2="500" class="grid"/>
  <line x1="1087" y1="250" x2="1087" y2="500" class="grid"/>
  <line x1="1250" y1="250" x2="1250" y2="500" class="grid"/>

  <text x="75" y="280" class="label">Cold pod start</text>
  <text x="75" y="302" class="small">3.605 / N/A / 4.339 s</text>
  <rect x="435" y="263" width="293.8" height="16" rx="3" class="base"/>
  <rect x="435" y="285" width="353.6" height="16" rx="3" class="erofs"/>
  <text x="797" y="298" class="erofs-delta">+20.37%</text>

  <text x="75" y="340" class="label">Cached pod start</text>
  <text x="75" y="362" class="small">1.492 / N/A / 1.522 s</text>
  <rect x="435" y="323" width="121.6" height="16" rx="3" class="base"/>
  <rect x="435" y="345" width="124.1" height="16" rx="3" class="erofs"/>
  <text x="567" y="358" class="erofs-delta">+2.04%</text>

  <text x="75" y="400" class="label">Always-pull pod start</text>
  <text x="75" y="422" class="small">1.994 / N/A / 3.563 s</text>
  <rect x="435" y="383" width="162.5" height="16" rx="3" class="base"/>
  <rect x="435" y="405" width="290.4" height="16" rx="3" class="erofs"/>
  <text x="733" y="418" class="erofs-delta">+78.69%</text>

  <text x="75" y="460" class="label">Cold image acquisition</text>
  <text x="75" y="482" class="small">1.751 / N/A / 2.422 s</text>
  <rect x="435" y="443" width="142.7" height="16" rx="3" class="base"/>
  <rect x="435" y="465" width="197.4" height="16" rx="3" class="erofs"/>
  <text x="640" y="478" class="erofs-delta">+38.27%</text>

  <text x="435" y="545" text-anchor="middle" class="small">0 s</text>
  <text x="598" y="545" text-anchor="middle" class="small">2</text>
  <text x="761" y="545" text-anchor="middle" class="small">4</text>
  <text x="924" y="545" text-anchor="middle" class="small">6</text>
  <text x="1087" y="545" text-anchor="middle" class="small">8</text>
  <text x="1250" y="545" text-anchor="middle" class="small">10 s</text>

  <rect x="50" y="610" width="1340" height="510" rx="10" class="panel"/>
  <text x="75" y="647" class="panel-title">B. Eight-layer signed image</text>
  <text x="75" y="673" class="small">Values are gray / green / purple means. The older green harness did not measure always-pull startup.</text>

  <line x1="435" y1="700" x2="435" y2="1040" class="axis"/>
  <line x1="598" y1="700" x2="598" y2="1040" class="grid"/>
  <line x1="761" y1="700" x2="761" y2="1040" class="grid"/>
  <line x1="924" y1="700" x2="924" y2="1040" class="grid"/>
  <line x1="1087" y1="700" x2="1087" y2="1040" class="grid"/>
  <line x1="1250" y1="700" x2="1250" y2="1040" class="grid"/>

  <text x="75" y="735" class="label">Cold pod start</text>
  <text x="75" y="757" class="small">4.572 / 4.550 / 9.917 s</text>
  <rect x="435" y="718" width="372.6" height="16" rx="3" class="base"/>
  <rect x="435" y="740" width="370.8" height="16" rx="3" class="overlay"/>
  <text x="814" y="753" class="passive-delta">-0.5%</text>
  <rect x="435" y="762" width="808.2" height="16" rx="3" class="erofs"/>
  <text x="1255" y="775" class="erofs-delta">+116.93%</text>

  <text x="75" y="820" class="label">Cached pod start</text>
  <text x="75" y="842" class="small">1.409 / 1.274 / 1.377 s</text>
  <rect x="435" y="803" width="114.8" height="16" rx="3" class="base"/>
  <rect x="435" y="825" width="103.8" height="16" rx="3" class="overlay"/>
  <text x="547" y="838" class="passive-delta">-9.6%</text>
  <rect x="435" y="847" width="112.2" height="16" rx="3" class="erofs"/>
  <text x="555" y="860" class="erofs-delta">-2.25%</text>

  <text x="75" y="905" class="label">Always-pull pod start</text>
  <text x="75" y="927" class="small">2.056 / N/A / 7.399 s</text>
  <rect x="435" y="888" width="167.6" height="16" rx="3" class="base"/>
  <text x="435" y="923" class="na">green value unavailable</text>
  <rect x="435" y="932" width="603.0" height="16" rx="3" class="erofs"/>
  <text x="1046" y="945" class="erofs-delta">+259.80%</text>

  <text x="75" y="990" class="label">Cold image acquisition</text>
  <text x="75" y="1012" class="small">2.784 / 2.626 / 7.643 s</text>
  <rect x="435" y="973" width="226.9" height="16" rx="3" class="base"/>
  <rect x="435" y="995" width="214.0" height="16" rx="3" class="overlay"/>
  <text x="657" y="1008" class="passive-delta">-5.7%</text>
  <rect x="435" y="1017" width="622.9" height="16" rx="3" class="erofs"/>
  <text x="1066" y="1030" class="erofs-delta">+174.55%</text>

  <text x="435" y="1085" text-anchor="middle" class="small">0 s</text>
  <text x="598" y="1085" text-anchor="middle" class="small">2</text>
  <text x="761" y="1085" text-anchor="middle" class="small">4</text>
  <text x="924" y="1085" text-anchor="middle" class="small">6</text>
  <text x="1087" y="1085" text-anchor="middle" class="small">8</text>
  <text x="1250" y="1085" text-anchor="middle" class="small">10 s</text>
</svg>
