  <rect x="50" y="1020" width="1340" height="785" rx="10" class="panel"/>
  <text x="75" y="1057" class="panel-title">B. Signed 8-layer pull and Kubernetes startup</text>
  <text x="75" y="1086" class="method">Image: same manifest digest and bytes as panel A's unsigned 8-layer image (about 21 MB); signing differs via its referrer.</text>
  <text x="75" y="1110" class="method">Pull: direct node-side crictl pull after verifying the image is absent or already cached on the host; debug-pod setup is outside the timer.</text>
  <text x="75" y="1134" class="method">Pull values average per-run medians: IPE disabled uses 2 runs and 20 samples; IPE audit uses 1192978, 1 run and 10 samples.</text>
  <text x="75" y="1158" class="method">Pod start: same kubectl run -&gt; observed Running boundary as panel A; cold includes the pull, while cached uses the image already cached on the host.</text>
  <text x="75" y="1182" class="method">Pod values average run means: every build runs=2; 3 nodes x 10 iterations = 30/run and n=60 total per condition.</text>

