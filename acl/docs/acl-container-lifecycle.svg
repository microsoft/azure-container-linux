  <rect x="50" y="1830" width="1340" height="60" rx="9" class="result"/>
  <text x="75" y="1858" class="value">Result:</text>
  <text x="135" y="1858" class="small">The active build is slower even for unsigned images, so the startup regression is not limited to signed verification.</text>
  <text x="75" y="1881" class="small">The byte-identical signed 8-layer path adds larger pull/start costs; attribution still requires an IPE-off EROFS isolate.</text>
</svg>
