<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1910" viewBox="0 0 1440 1910" role="img" aria-labelledby="title desc">
  <title id="title">Unsigned pod startup and signed image lifecycle by MAP build</title>
  <desc id="desc">Panel A compares cold and host-cached Kubernetes pod startup for unsigned one-layer and eight-layer images. The timer runs from immediately before kubectl run until Kubernetes reports Running. Panel B compares cold and host-cached direct node-side pulls and Kubernetes pod startup for the byte-identical signed eight-layer image. Each label includes percent difference from the base image and lower values are better. Unsigned and signed pod startup each have two valid pipeline runs and 60 timing samples per condition for every image. Pull lifecycle has two runs and 20 samples for images with IPE disabled, and one valid run with 10 samples for the IPE audit image.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #475569; }
    .panel-title { font-size: 23px; font-weight: 700; }
    .method { font-size: 15px; fill: #475569; }
    .group { font-size: 17px; font-weight: 700; }
    .legend { font-size: 15px; font-weight: 600; }
    .small { font-size: 14px; fill: #4b5563; }
    .value { font-size: 14px; font-weight: 700; }
    .grid { stroke: #d8dee9; stroke-width: 1; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .base { fill: #6b7280; }
    .assets { fill: #27845b; }
    .patched { fill: #2563eb; }
    .active { fill: #d97706; }
    .result { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.25; }
  </style>

  <rect x="0" y="0" width="1440" height="1910" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Container lifecycle: unsigned startup and signed-image path</text>
  <text x="60" y="88" class="subtitle">All valid same-settings runs have equal run-level weight. Labels show change vs base; lower is better. Deltas are not isolated feature costs.</text>

  <rect x="70" y="112" width="18" height="18" rx="3" class="base"/>
  <text x="98" y="126" class="legend">Base image, base overlayfs</text>
  <text x="98" y="148" class="small">MAP 1188747</text>
  <rect x="720" y="112" width="18" height="18" rx="3" class="assets"/>
  <text x="748" y="126" class="legend">IPE off, passive assets</text>
  <text x="748" y="148" class="small">MAP 1191353</text>
  <rect x="70" y="166" width="18" height="18" rx="3" class="patched"/>
  <text x="98" y="180" class="legend">IPE off, passive assets + patched overlayfs</text>
  <text x="98" y="202" class="small">MAP 1190061</text>
  <rect x="720" y="166" width="18" height="18" rx="3" class="active"/>
  <text x="748" y="180" class="legend">IPE audit, patched EROFS*</text>
  <text x="748" y="202" class="small">MAP 1191171</text>
  <text x="70" y="228" class="small">* Permissive policy evaluation: ipe.enforce=0 and ipe.success_audit=0; ALLOW verdicts are not logged, but DENY paths remain audit-visible.</text>

  <rect x="50" y="250" width="1340" height="745" rx="10" class="panel"/>
  <text x="75" y="287" class="panel-title">A. Unsigned Kubernetes pod startup</text>
  <text x="75" y="316" class="method">Images: unsigned 1-layer Alpine (about 3.6 MB) and unsigned 8-layer nginx-compatible image (about 21 MB).</text>
  <text x="75" y="340" class="method">Timer: immediately before kubectl run -&gt; tight polling stops when Kubernetes reports pod phase=Running on the pinned node.</text>
  <text x="75" y="364" class="method">Cold proves the image is absent and uses imagePullPolicy=Always; cached proves it is already cached on the host and uses imagePullPolicy=Never.</text>
  <text x="75" y="388" class="method">Every build: runs=2; 3 nodes x 10 iterations = 30/run and n=60 total per condition. Equal-weight means of run means.</text>

  <line x1="400" y1="410" x2="400" y2="900" class="axis"/>
  <line x1="521.4" y1="410" x2="521.4" y2="900" class="grid"/>
  <line x1="642.9" y1="410" x2="642.9" y2="900" class="grid"/>
  <line x1="764.3" y1="410" x2="764.3" y2="900" class="grid"/>
  <line x1="885.7" y1="410" x2="885.7" y2="900" class="grid"/>
  <line x1="1007.1" y1="410" x2="1007.1" y2="900" class="grid"/>
  <line x1="1128.6" y1="410" x2="1128.6" y2="900" class="grid"/>
  <line x1="1250" y1="410" x2="1250" y2="900" class="grid"/>

