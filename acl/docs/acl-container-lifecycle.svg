  <text x="400" y="947" text-anchor="middle" class="small">0 s</text>
  <text x="521.4" y="947" text-anchor="middle" class="small">1</text>
  <text x="642.9" y="947" text-anchor="middle" class="small">2</text>
  <text x="764.3" y="947" text-anchor="middle" class="small">3</text>
  <text x="885.7" y="947" text-anchor="middle" class="small">4</text>
  <text x="1007.1" y="947" text-anchor="middle" class="small">5</text>
  <text x="1128.6" y="947" text-anchor="middle" class="small">6</text>
