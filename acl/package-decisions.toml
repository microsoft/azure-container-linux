# Sources describe pinned packaging and code paths, not a live-node audit.
# Kubernetes references use upstream v1.34.1, not a verified node version.
# Source comments are excluded from loaded reasons. URLs remain unwrapped.
# Source links in reasons and comments document selection or dependency claims.
# Recipe dependencies establish possible inclusion paths, not historical transactions.
# Unverified original requesters are stated explicitly; absence of callers is an audit finding.
# Dependency/removal references use exact RPM package names, not product names.
# Package names identify binary RPMs, including subpackages; commands and SONAMEs
# describe their payloads, not substitute package identities.
# Keep means required in the production base, not in every optional extension.
# Sysext-only RPM dependencies belong in the rebuilt sysext, including OEM dependencies.
# Rebuild extensions against the reduced build-base with matching RPM records.
# A sysext RPM requirement alone never justifies keep: true. Independent host
# boot, provisioning, and support callers are separate retention evidence.
