# The review covered pinned packaging and code paths. Live nodes remain unaudited.
# Kubernetes references use upstream v1.34.1. The node version is unverified.
# Source comments are excluded from loaded reasons. URLs remain unwrapped.
# Source links in reasons and comments document selection or dependency claims.
# Recipe dependencies show possible inclusion paths. They don't establish historical transactions.
# The review states when the original requester is unverified. Missing callers are audit findings.
# Dependency/removal references use exact RPM package names. They don't use product names.
# Package names identify binary RPMs, including subpackages.
# Keep means required in the production base. Optional extensions have separate requirements.
# Sysext-only RPM dependencies belong in the rebuilt sysext, including OEM dependencies.
# Rebuild extensions against the reduced build-base with matching RPM records.
# A sysext RPM requirement alone never justifies decision = "keep". Independent host boot, provisioning, and support callers
# provide separate reasons to keep a package.

["abseil-cpp"]
decision = "remove-dependency"

["acl"]
decision = "keep"
# Payload: %files owns getfacl and setfacl.
# https://github.com/microsoft/azurelinux/blob/a526a629b8ff3db2ec8a9633803506bd61118bca/SPECS/acl/acl.spec
# Consumer: overlaycleanup calls usrbin getfacl; .no-dup-update skips cleanup.
# https://github.com/flatcar/bootengine/blob/daf43bf9c1ca45bf1a43566c3a6f96ec0cb44a36/dracut/99setup-root/initrd-setup-root
# Activation: module installer installs the script and its service.
# https://github.com/flatcar/bootengine/blob/daf43bf9c1ca45bf1a43566c3a6f96ec0cb44a36/dracut/99setup-root/module-setup.sh
# https://github.com/flatcar/bootengine/blob/daf43bf9c1ca45bf1a43566c3a6f96ec0cb44a36/dracut/99setup-root/initrd-setup-root.service
reason = """\
    Contains getfacl and setfacl. The bootengine package compares real-root getfacl output while cleaning the /etc \
    overlay during boot, when overlay cleanup is enabled."""

["afterburn"]
decision = "keep"
# Payload: afterburn subpackage owns the renamed coreos-metadata binary.
# https://github.com/microsoft/azurelinux/blob/a526a629b8ff3db2ec8a9633803506bd61118bca/SPECS/rust-afterburn/rust-afterburn.spec
# Consumer: ExecStart uses coreos-metadata; conditions include Azure.
# https://github.com/flatcar/bootengine/blob/daf43bf9c1ca45bf1a43566c3a6f96ec0cb44a36/dracut/30ignition/flatcar-metadata-hostname.service
# Activation: the first-boot generator and real-root executable wrapper.
# https://github.com/flatcar/bootengine/blob/daf43bf9c1ca45bf1a43566c3a6f96ec0cb44a36/dracut/30ignition/ignition-generator
# https://github.com/flatcar/bootengine/blob/daf43bf9c1ca45bf1a43566c3a6f96ec0cb44a36/dracut/30ignition/module-setup.sh
# ACL supplies the first-boot and Azure OEM command-line addons.
# https://github.com/microsoft/azure-container-linux/blob/39668ce60123274ead5bf599e198f91edd04ff0d/build_library/rpm/uki_install.sh
# https://github.com/microsoft/azure-container-linux/blob/39668ce60123274ead5bf599e198f91edd04ff0d/build_library/vm_image_util.sh
# https://github.com/microsoft/azure-container-linux/blob/39668ce60123274ead5bf599e198f91edd04ff0d/build_library/rpm/uki_addon.sh
reason = """\
    Contains the afterburn package's cloud-metadata executable, coreos-metadata. ACL's Azure first-boot hostname \
    service invokes it."""

["azure-vm-utils"]
decision = "keep"
# Payload: azure-nvme-id and 80-azure-disk.rules.
# https://github.com/microsoft/azurelinux/blob/a526a629b8ff3db2ec8a9633803506bd61118bca/SPECS/azure-vm-utils/azure-vm-utils.spec
