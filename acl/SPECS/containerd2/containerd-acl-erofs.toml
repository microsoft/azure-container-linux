# Dormant ACL profile. The shared containerd2 package does not import this
# file by default; ACL provisioning explicitly imports it.
version = 2

# Explicitly opt this profile into dm-verity referrer handling. The snapshotter
# still uses permissive "auto" mount policy: verify layers with a .dmverity
# sidecar and mount ordinary EROFS layers plainly. An unset mode has the same
# mount behavior but deliberately does not advertise the referrer capability.
[plugins."io.containerd.snapshotter.v1.erofs"]
  dmverity_mode = "auto"

# snapshotter is set in both the legacy and the v3 location; neither alone is
# sufficient. Imports are merged before the v2->v3 migration runs and this file
# is imported last, so the legacy key here beats any global legacy snapshotter
# in the base config. AKS emits one on the artifact streaming SKU
# (snapshotter = "overlaybd"), and this profile deliberately overrides it:
# layer integrity outranks a pull-latency optimisation. Kata is unaffected --
# its snapshotter = "tardev" is scoped to containerd.runtimes.kata-cc and never
# sets the global default. The v3 key in turn covers base configs that define
# no grpc.v1.cri.containerd.runtimes, because migrateConfig returns early in
# that case and never copies the legacy key.
[plugins."io.containerd.grpc.v1.cri"]
  [plugins."io.containerd.grpc.v1.cri".containerd]
    snapshotter = "erofs"

[plugins."io.containerd.cri.v1.images"]
  snapshotter = "erofs"

[plugins."io.containerd.service.v1.diff-service"]
  # Deferred first-use unpack runs through the generic diff service. The EROFS
  # differ must see signed EROFS layers first; it returns ErrNotImplemented for
  # other snapshotters so walking remains the ordinary fallback.
  default = ["erofs", "walking"]

[plugins."io.containerd.transfer.v1.local"]
  # Defining unpack_config REPLACES containerd's built-in default of
  # {platform, overlayfs, walking differ}. The snapshotter here is not a
  # duplicate of the one above: that one is what CRI requests, this is the set
  # of combinations the transfer service supports, and getSupportedPlatform
  # unpacks only when the two match. This is also the only place the differ
  # can be named.
  [[plugins."io.containerd.transfer.v1.local".unpack_config]]
    platform = "linux/amd64"
    snapshotter = "erofs"
    differ = "erofs"

[plugins."io.containerd.differ.v1.erofs"]
  # The differ advertises that it can consume dm-verity artifacts. Referrer
  # discovery is enabled only when this capability is paired with the explicit
  # snapshotter capability above, keeping overlayfs and stock EROFS inert.
  enable_dmverity = true
  enable_tar_index = true
  # Must remain byte-compatible with the signing tool's mkfs.erofs invocation.
  # The layer UUID is deliberately absent: the differ derives it from the layer
  # digest and appends -U after these options, and precomputed artifacts are
  # rejected unless their superblock carries that derived UUID.
  mkfs_options = ["--sort=none", "-T", "0", "--mkfs-time"]
