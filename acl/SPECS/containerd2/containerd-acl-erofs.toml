# ACL EROFS/dm-verity capability profile.
#
# The ACL composition roots import this profile whether CRI currently uses
# overlayfs or EROFS. Keeping the capability loaded lets VHD baking retain
# signed EROFS referrers while unpacking small images into overlayfs. Runtime
# snapshotter selection remains separate in acl-erofs-runtime.toml.
version = 2

# Keep the registry root to a single directory on this mirror-test branch.
# Local CRI pulls split path lists, but transfer-service pulls pass config_path
# through as one HostDir; the normal colon-separated default would therefore
# miss the packaged mcr.microsoft.com/hosts.toml and silently use MCR.
[plugins."io.containerd.grpc.v1.cri".registry]
  config_path = "/etc/containerd/certs.d"

[plugins."io.containerd.cri.v1.images".registry]
  config_path = "/etc/containerd/certs.d"

# Explicitly opt this profile into dm-verity referrer handling. The snapshotter
# still uses permissive "auto" mount policy: verify layers with a .dmverity
# sidecar and mount ordinary EROFS layers plainly. An unset mode has the same
# mount behavior but deliberately does not advertise the referrer capability.
[plugins."io.containerd.snapshotter.v1.erofs"]
  dmverity_mode = "auto"

[plugins."io.containerd.transfer.v1.local"]
  # Defining unpack_config REPLACES containerd's built-in default of
  # {platform, overlayfs, walking differ}, so preserve that path for every
  # supported ACL architecture alongside EROFS. getSupportedPlatform selects
  # only the requested combination.
  [[plugins."io.containerd.transfer.v1.local".unpack_config]]
    platform = "linux/amd64"
    snapshotter = "overlayfs"
    differ = "walking"

  [[plugins."io.containerd.transfer.v1.local".unpack_config]]
    platform = "linux/amd64"
    snapshotter = "erofs"
    differ = "erofs"

  [[plugins."io.containerd.transfer.v1.local".unpack_config]]
    platform = "linux/arm64"
    snapshotter = "overlayfs"
    differ = "walking"

  [[plugins."io.containerd.transfer.v1.local".unpack_config]]
    platform = "linux/arm64"
    snapshotter = "erofs"
    differ = "erofs"

[plugins."io.containerd.differ.v1.erofs"]
  # The differ advertises that it can consume dm-verity artifacts. Referrer
  # discovery is enabled only when this capability is paired with the explicit
  # snapshotter capability above. Overlayfs remains the ordinary CRI path when
  # IPE is inactive.
  enable_dmverity = true
  enable_tar_index = true
  # Must remain byte-compatible with the signing tool's mkfs.erofs invocation.
  # The layer UUID is deliberately absent: the differ derives it from the layer
  # digest and appends -U after these options, and precomputed artifacts are
  # rejected unless their superblock carries that derived UUID.
  mkfs_options = ["--sort=none", "-T", "0", "--mkfs-time"]
