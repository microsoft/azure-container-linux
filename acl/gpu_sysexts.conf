# GPU sysext definitions for Azure Container Linux (ACL)
# ======================================================
#
# This file defines the GPU sysexts built alongside ACL images.
# GPU sysexts are standalone squashfs images (.raw) — they are built
# during VM conversion (image_to_vm.sh) and are NOT baked into the rootfs.
# At runtime they are activated via systemd-sysext.
#
# HOW TO ADD A NEW GPU SYSEXT
# ---------------------------
# 1. Add an entry to the GPU_SYSEXTS array below.
#    Format:  "name|category/package"
#      - name      → sysext output filename (e.g. "nvidia-driver-cuda-open" → nvidia-driver-cuda-open.raw)
#      - category/package → portage-style package name used by build_sysext.
#        Multiple packages can be joined with & (e.g. "foo|cat/pkg1&cat/pkg2").
#
# 2. Add the RPM mapping in build_library/rpm/package_catalog.sh:
#      ["category/package"]="rpm-name"
#
# 3. (Optional) Create a mangle script: build_library/sysext_mangle_<name>
#    Needed when the RPM installs files outside /usr (e.g. /etc, /bin, /lib).
#    sysexts can only ship files under /usr, so the mangle script relocates
#    them (see sysext_mangle_nvidia-driver-cuda-open or sysext_mangle_nvidia-container-toolkit
#    for examples).  If no mangle script exists, none is used.
#
# That's it — the rest of the pipeline (install_gpu_sysexts, run_sdk_container,
# image_to_vm.sh, validation) is fully data-driven and picks up new entries
# automatically.
#
# ENTRY FORMAT
# ------------
#   "name|category/package"           — single-package sysext
#   "name|category/pkg1&category/pkg2" — multi-package sysext (both pkgs merged)
#
# The category/package names MUST have a corresponding entry in
# build_library/rpm/package_catalog.sh (portage-name → RPM-name mapping).

GPU_SYSEXTS=(
    "nvidia-driver-cuda-open|nvidia-gpu-drivers/cuda-open"
    "nvidia-driver-cuda|nvidia-gpu-drivers/cuda"
    "nvidia-container-toolkit|nvidia-user-space/nvidia-container-toolkit"
    "nvidia-fabric-manager|nvidia-user-space/nvidia-fabric-manager"
)
